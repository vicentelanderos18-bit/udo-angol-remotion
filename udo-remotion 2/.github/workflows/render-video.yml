name: Exportar video DEM Angol

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libx11-xcb1 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 fonts-dejavu-core

      - name: Instalar Remotion
        run: npm install

      - name: Renderizar video a 60 FPS
        run: |
          mkdir -p out
          npx remotion render UDO-Angol \
            out/UDO_Angol_60fps.mp4 \
            --codec=h264 \
            --crf=18 \
            --concurrency=2

      - name: Guardar video exportado
        uses: actions/upload-artifact@v4
        with:
          name: Video-UDO-Angol-60FPS
          path: out/UDO_Angol_60fps.mp4
          if-no-files-found: error
